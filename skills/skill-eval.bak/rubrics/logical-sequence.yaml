# S26: Logical step sequence
#
# Checks P1 (Accuracy) — steps follow a logical order where
# each step's prerequisites are satisfied by prior steps.
# Ported from agentfs-eval R4 semantic check.

id: logical-sequence
version: 1
principle: P1
check_id: S26
severity: warn
target: "SKILL.md step sections"

prompt_template: |
  You are a technical reviewer. Read the following skill instructions
  and answer ONLY the question below.

  SKILL INSTRUCTIONS:
  "{entry}"

  QUESTION: Do the steps in this skill follow a logical sequence
  where each step's prerequisites are satisfied by prior steps?

  A) Yes — the steps are logically ordered and coherent
  B) No — at least one step depends on something not established
     by prior steps
  C) Unable to assess — the skill has no sequential steps

  Answer with ONLY the letter (A, B, or C).

pass_answers: ["A", "C"]
fail_answers: ["B"]
fail_routing:
  B: "Steps not logically ordered — a step references something not established by prior steps"
vote_count: 1
