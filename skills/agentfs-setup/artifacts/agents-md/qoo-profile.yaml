# qoo-profile.yaml — AGENTS.md artifact
# Semantic QOO assessment of the generated system prompt
# Computed by frontier model at assessment time (Tier 2)

artifact: AGENTS.md
source_skill: agentfs-setup
version: "7.4.1"
computed_by: claude-opus-4-20250514
computed_at: "2026-10-27"

# --- MCACS Assessment ---
mcacs:
  modularity:
    score: good
    notes: >
      Rules are mostly independent. R1 (dispatch) does not reference
      R2-R7. R3 (post-write) is self-contained. R6 (checkpoint)
      references seed-agents-md.sh — acceptable coupling to own source.

  cohesion:
    score: poor
    notes: >
      R1 (Signal Dispatch) mixes 4 concerns in one rule: keyword
      extraction, KGM search, skill loading, and retry/fallback.
      R2 (Pre-Flight) mixes complexity assessment with two execution
      tiers (Standard vs Specification-Driven). Both should be split.
    violations:
      - "R1 step 2 combines keyword definition AND usage constraint in one sentence"
      - "R1 mixes extraction, search, load, retry in 6 sub-steps"
      - "R2 embeds two full tiers (12 sub-steps total) in one rule"

  abstraction:
    score: poor
    notes: >
      R1 keyword extraction interface is ambiguous. 'Use literally'
      is buried in a sentence about article exclusion. The example
      in step 1 shows 'check headroom status' which is actually a
      KGM-miss query — teaching the wrong behavior. The 14B model
      adds 'check' to queries because the example primed it.
    violations:
      - "R1 step 1 example uses 'check headroom status' — a KGM-miss query"
      - "R1 step 2 'Use literally' constraint buried at end of complex sentence"
      - "R4 canary format '🐦 word-word' relies on model inferring hyphenation"

  coupling:
    score: good
    notes: >
      Rules correctly depend on external tools (search_nodes,
      load_skill, post-write.sh) but don't depend on each other's
      internal state. R1 → R3 dependency is implicit (dispatch may
      lead to writes that trigger post-write) but not problematic.

  separation_of_concerns:
    score: moderate
    notes: >
      KGM search behavior is split between R1 (dispatch rule) and
      the KGM index format. R1 assumes KGM search matches multi-word
      queries but doesn't state how. The model doesn't know whether
      to send exact words or semantic rephrasing.
    violations:
      - "R1 doesn't specify KGM search is keyword-exact, not fuzzy"

# --- Identified Evolution Points ---
evolution_points:
  - id: EP1
    rule: R1
    priority: HIGH
    title: "Separate keyword extraction from search execution"
    problem: >
      Step 1 combines 'call search_nodes' with an example.
      Step 2 combines keyword definition with usage constraint.
      14B model misses the literal-usage constraint.
    fix: >
      Split into: Step 1 (extract keywords — copy exactly, do not
      add/remove/reorder), Step 2 (call search_nodes with exact
      keywords), Step 3+ (handle results).
    expected_impact: "T3 80% → 90%+ (eliminate FM1 rephrasing)"

  - id: EP2
    rule: R1
    priority: HIGH
    title: "Replace misleading example"
    problem: >
      Example shows 'hey check headroom status' → query 'check
      headroom status'. This query returns empty from KGM. The
      example teaches wrong behavior.
    fix: >
      Change to 'hey crc status' → keywords = 'crc status'.
      Use a query that actually resolves in KGM.
    expected_impact: "Eliminates priming for keyword fabrication"

  - id: EP3
    rule: R1
    priority: MEDIUM
    title: "Add KGM search behavior note"
    problem: >
      Model doesn't know KGM search is keyword-exact. It may
      rephrase hoping for fuzzy match.
    fix: >
      Add one sentence: 'KGM search matches exact words. Rephrased
      queries will miss.'
    expected_impact: "Reinforces literal keyword usage"

  - id: EP4
    rule: R2
    priority: LOW
    title: "Reduce Pre-Flight cognitive load"
    problem: >
      43 lines, 211 words, 8 sub-steps, 4 conditionals. Highest
      cognitive load of all rules. Two full execution tiers embedded.
      14B model may skip or simplify.
    fix: >
      Consider: move Tier 2 (Specification-Driven) to a separate
      reference document. R2 states 'Assess complexity. If Standard,
      do X. If Specification-Driven, load the spec-driven procedure.'
    expected_impact: "R2 drops from 211 to ~80 words"

  - id: EP5
    rule: R4
    priority: MEDIUM
    title: "Front-load canary in rule text"
    problem: >
      Canary rule has 4 sub-steps. Step 1 reads USER.md (file I/O).
      Step 2 writes canary. 14B model sometimes processes neither —
      T1 at 60%. The I/O in step 1 may distract from step 2.
    fix: >
      Reorder: Step 1 = write canary (the critical action).
      Step 2 = read USER.md (can fail gracefully).
    expected_impact: "T1 60% → 70%+ (reduces first-turn cognitive load)"

  - id: EP6
    rule: R1
    priority: MEDIUM
    title: "Add anti-bypass instruction after load_skill"
    problem: >
      After search_nodes returns a skill, model sometimes skips
      load_skill and acts directly (FM2/FM3). R1 step 3 says
      'If result is a skill → load_skill' but doesn't prohibit
      the alternative.
    fix: >
      Add: 'You MUST call load_skill. Do NOT execute the skill
      content from memory or training data.'
    expected_impact: "Eliminates FM2 (fabrication) and FM3 (explanation)"

# --- Implicit Assumptions ---
implicit_assumptions:
  - name: "KGM search is substring/keyword-based"
    found_by: "Benchmark v1 — 'check headroom status' returns empty"
    status: "UNFIXED — not stated in R1"
    mcacs: "Abstraction — interface doesn't document search behavior"

  - name: "Model processes all rules on turn 1"
    found_by: "T1 canary 60% on 14B"
    status: "UNFIXED — model-level, may not be fully fixable"
    mcacs: "Not attributable to AGENTS.md design"

  - name: "Model uses keywords literally, not semantically"
    found_by: "T3 FM1 — model adds 'check' to 'crc status'"
    status: "UNFIXED — constraint is stated but not enforced by CNL structure"
    mcacs: "Abstraction — instruction wording too weak for 14B"
