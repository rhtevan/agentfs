# AgentFS Compliance Profile
# Measures how reliably each model tier obeys the AGENTS.md rules.
# Updated by ~/.agents/scripts/update-compliance.sh — one tier per run.
# See: ~/.agents/knowledge/agentfs-engineering-evolution/dry-run-and-compliance-plan.md (Objective 2)
#      ~/.agents/knowledge/agentfs-engineering-evolution/benchmark-results.md

schema_version: "1.2"
agents_md_version: "7.13.1"
# Provenance only (2026-11-18): rules_hash / harness_sha / writer_sha /
# hooks_sha are recorded but no script compares them. Re-measuring is a
# semantic decision: update-compliance.sh --check lists rules-template
# commits since the records; classify none | smoke | partial | full.
agents_md_rules_hash: "c5fb6ff9e0a43281"
compliance_target: "≥90%"
required_tiers: [T2, T3, T4]

# ── Tier Definitions (2026-11-16) ────────────────────────────────────────
# Mirrors skill-qoo-qualification-plan.md → Tier Definitions.
tier_definitions:
  T1: "Any model (8B+). Reference only — T1 compliance is not a goal."
  T2: >-
    Self-hostable mid-range: open-weight, >=14B, fits the rhel-ai
    baseline (4x NVIDIA L4, ~21.4 GiB usable each at 0.95 util) with
    >=64K context. rhel-ai is a sizing baseline only.
  T3: >-
    Strong, non-frontier, NOT hostable on the rhel-ai baseline
    (open-weight beyond rhel-ai capacity, or closed mid-tier).
  T4: "Frontier only."

# ── Tier Representatives ─────────────────────────────────────────────────
# Default model per tier for update-compliance.sh --tier Tx.
representatives:
  T4:
    provider: gcp_vertex_ai
    model: claude-sonnet-5-5
    note: >-
      Same model as before, provider moved 2026-11-23: the post-wipe corp key
      (subscription "personal") returns 403 model_not_entitled for
      claude-sonnet-5.5. Previous: custom_corp claude-sonnet-5.5.
  T3:
    provider: custom_corp
    model: glm-5-3
    note: >-
      Open-weight, ~756 GB - not rhel-ai hostable. Selected 2026-11-17 from
      14-model screen (10/10; only non-frontier model to pass R2 Pre-Flight).
      Previous: NVIDIA-Nemotron-3-Super-120B (76%, archived).
  T2:
    provider: custom_corp
    model: Qwen3.8-27B-FP8
    note: >-
      Fits 2x L4 (TP2) at 64K (18.4 GiB/GPU). Selected 2026-11-17 from
      14-model screen (8/10, perfect except R2). Previous: nemotron-3-nano-ga
      (60%, archived); before that gpt-oss-20b (Corp harmony corruption).
  T1:
    provider: custom_corp
    model: granite-4.1-8b

