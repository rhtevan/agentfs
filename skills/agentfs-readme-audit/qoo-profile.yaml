# QOO Profile — agentfs-readme-audit
# Computed by frontier model at authorship (Phase 2.3)
# Tier 2 semantic metrics not computable by gather-skill-state.sh
#
# This is the FIRST qoo-profile.yaml ever created — the reference
# pattern for all future skills.

qoo-version: "1.0"
skill: agentfs-readme-audit
skill-version: "3.0.0"
computed-by: claude-sonnet
computed-at: "2026-10-27"

# --- Action Step Analysis ---
action_steps: 6
  # Step 0: Resolve Scope (→ gather-state.sh)
  # Step 1: Gather Actual State (→ gather-state.sh)
  # Step 2: Read README (→ gather-state.sh)
  # Step 3: Semantic Comparison (→ evaluate-readme.sh + LLM interpretation)
  # Step 4: Produce Report (LLM formatting)
  # Step 5: Recommend Fixes (LLM semantic)
scripted_steps: 3
  # Steps 0-2 fully in gather-state.sh
  # Step 3 partially in evaluate-readme.sh (SDM dimensions)
script_coverage_pct: 50
  # 3 of 6 steps backed by scripts. Steps 3-5 remain LLM-dependent
  # but Step 3 now delegates dimension evaluation to SDM via script.

# --- Cohesion Analysis ---
concern_count: 3
concerns:
  - "state gathering (scripts/gather-state.sh)"
  - "alignment evaluation (scripts/evaluate-readme.sh + LLM)"
  - "reporting and recommendations (LLM)"
  # Reduced from 6 original concerns. Data gathering, scope resolution,
  # and README reading are now unified in gather-state.sh (single concern).
  # Semantic analysis split into SDM-backed evaluation + LLM interpretation.

# --- Accidental Complexity ---
accidental_lines: 0
accidental_pct: 0
  # After 2.4 rewrite: SKILL.md will contain zero inline shell commands.
  # All implementation detail moves to scripts. SKILL.md = orchestration only.
  # Current v2.1.0 SKILL.md has 64% accidental complexity — to be eliminated.

# --- Model Assumptions ---
model_assumptions:
  - "Step 3 semantic comparison still requires LLM to interpret gather-state output and evaluate-readme SDM results contextually"
  - "Step 4 report formatting requires LLM to produce structured Markdown table"
  - "Step 5 fix recommendations require LLM semantic judgment"
model_assumption_count: 3
  # These are INTENTIONAL LLM tasks (semantic judgment, formatting).
  # They cannot be moved to scripts or SDM without loss of quality.
  # A 14B model should handle these given explicit SDM dimension scores
  # as input — no multi-hop reasoning required.

# --- CNL Compliance ---
cnl_violations:
  - "Current v2.1.0 has multi-action sentences in Step 1 (gather + write temp file)"
  - "Current v2.1.0 mixes synonyms: 'check' vs 'verify' vs 'validate'"
  - "Passive voice in 'README.md does not need to be staged'"
cnl_compliance_pct: 70
  # After 2.4 rewrite: target 95%+ CNL compliance.
  # Step instructions will follow: one action per sentence, imperative voice,
  # single vocabulary (check→verify eliminated, use 'check' throughout).

# --- Operational Pattern ---
pattern: C
pattern_after_conversion: A
  # Original: Pure Pattern C (prose-only semantic analysis)
  # After conversion: Pattern A (scripted steps + bounded LLM orchestration)
  # SDM handles dimension evaluation, scripts handle state gathering.
  # LLM role reduced to: interpret SDM results, format report, suggest fixes.
