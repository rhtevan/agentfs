schema-version: "1.1"
schema-type: quality
artifact-type: agents-md
description: >
  MCACS quality standard adapted for the base skill (AGENTS.md rules,
  SOUL.md principles) — always-on policy prose loaded as system prompt.
  Dimensions measure design soundness of the item set, not imperative
  script workflows. The universal quality.yaml applies to SKILL.md
  (skill-eval, unchanged); this schema applies to the base skill.

  Static evaluation only: these dimensions predict adherence but never
  claim it — adherence is measured directly by the compliance campaign
  (compliance-profile.yaml). Deterministic checks (S0 template-check.sh)
  come first; SDM scoring here is optional.

  Evidence: gather-skill-state.sh (structural facts) + frontier model
  (semantic extraction per dimension) → sdm-evaluate.sh (scoring).
  Owner: agentfs-setup ("upgrade agentfs").
  Scores stored in: agentfs-setup/artifacts/agents-md/scores.yaml
  Methodology: knowledge/agentfs-engineering-evolution/evaluation-methodology.md §5

  v1.1 (2026-11-24, F22): removed accidental_complexity (contradicted
  design constraint C3, heuristic broken); added item_overlap.

dimensions:
  - name: rule_self_containment
    question: >
      Does each rule's Do block include ALL consequences of its
      actions? Are there any rules whose effects depend on a different
      rule firing afterward? Count rules that violate the
      Self-Contained Actions principle (design constraint C1).
    evidence_source: AGENTS.md rules
    metric: count
    target: "0"
    weight: 1.0
    mcacs: Modularity

  - name: rule_action_density
    question: >
      For each rule, how many distinct actions are in the Do block?
      Rules with more than 5 actions are harder for mid-range models
      to follow completely. Report the maximum action count across
      all rules.
    evidence_source: AGENTS.md rules
    metric: count
    target: "<= 5"
    weight: 1.0
    mcacs: Modularity

  - name: concern_count
    question: >
      How many distinct operational concerns does each rule address?
      Count from: dispatch routing, memory management, file operations,
      scope resolution, version control, checkpoint/recovery,
      user interaction. A rule addressing more than 2 concerns
      has low cohesion.
    evidence_source: AGENTS.md rules
    metric: count
    target: "<= 2"
    weight: 1.0
    mcacs: Cohesion

  - name: trigger_clarity
    question: >
      Can each rule's When clause be evaluated by reading ONLY the
      user's message and current session state, WITHOUT executing any
      action first? Count rules with effect-based triggers that
      require completed actions to evaluate.
    evidence_source: AGENTS.md rules
    metric: count
    target: "0"
    weight: 1.0
    mcacs: Abstraction

  - name: cross_rule_dependency
    question: >
      How many rules reference other rules by number or name in their
      Do blocks? Cross-references create coupling — changing one rule
      may break another. Count the number of inter-rule references.
    evidence_source: AGENTS.md rules
    metric: count
    target: "<= 1"
    weight: 1.0
    mcacs: Coupling

  - name: item_overlap
    question: >
      The items are always on together, so overlap and ambiguity
      across items matter. Count item pairs (rules, or principles)
      that cover the same situation or prescribe the same behaviour,
      plus terms used for two different concepts or two terms used
      for one concept (vocabulary collisions).
    evidence_source: AGENTS.md rules, SOUL.md principles
    metric: count
    target: "0"
    weight: 1.0
    mcacs: Cohesion
