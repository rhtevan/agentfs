schema-version: "1.1"
schema-type: observable
description: >
  Build-time measurement readiness standard for AgentFS skills.
  Evaluates whether a skill has the instrumentation to produce
  trustworthy audit trails at runtime — trace integration, CNL
  compliance, anti-fabrication guards, and SDM delegation.
  Observable is a prerequisite for runtime Operable (CECX) scoring.
  Used by skill-check and skill-evolve.

  Note: Observable does NOT measure structural properties (scripts
  existence, bones/muscle separation) — those belong in Operable
  (BMBT build-time readiness). Observable measures whether execution
  CAN BE OBSERVED, not whether the structure exists.

dimensions:
  - name: trace_instrumentation
    question: >
      Do the skill's scripts source trace-lib.sh and call trace_step()
      to produce an agent-agnostic execution trace? Check for the
      presence of trace_init, trace_step, and trace_end calls.
    evidence_source: scripts/
    metric: boolean
    target: "true"
    weight: 1.0

  - name: cnl_compliance
    question: >
      Do the action steps in SKILL.md follow Controlled Natural Language
      rules? Check: each sentence states exactly one action, all steps
      use active imperative voice, and one term is used per concept
      throughout (no synonym mixing).
    evidence_source: skill.md
    metric: ratio
    target: ">= 0.95"
    weight: 1.0

  - name: anti_fabrication
    question: >
      Does the skill SKILL.md contain explicit anti-fabrication rules
      such as "Do NOT generate output" or "Do NOT read files directly"?
    evidence_source: skill.md
    metric: boolean
    target: "true"
    weight: 1.0

  - name: sdm_delegation
    question: >
      For skills that require semantic judgment (Pattern C: prose-only
      analysis, evaluation, or alignment checking), are those judgments
      delegated to SDM via scripts rather than requiring the agent to
      perform multi-hop qualitative reasoning inline?
    evidence_source: skill.md + scripts/
    metric: boolean
    target: "true"
    weight: 1.0
    applies_to: [pattern_c]
