schema-version: "2.0"
schema-type: quality
description: >
  MCACS quality standard for AgentFS skills. Evaluates skill design
  against Modularity, Cohesion, Abstraction, Coupling, and Separation
  of Concerns principles. Used by skill-check and skill-evolve.

dimensions:
  - name: script_coverage
    question: >
      What percentage of the action steps in SKILL.md are backed by
      executable scripts in the scripts/ directory, versus prose-only
      instructions that require the agent to compose shell commands?
    evidence_source: skill.md + scripts/
    metric: ratio
    target: ">= 0.80"
    weight: 1.0
    mcacs: Modularity

  - name: inference_hop_count
    question: >
      How many reasoning steps must the agent perform between loading
      the skill and reaching the first deterministic script checkpoint?
      Count each step where the agent must interpret prose, make a
      decision, or compose a command without script support.
    evidence_source: skill.md workflow section
    metric: count
    target: "<= 2"
    weight: 1.0
    mcacs: Modularity

  - name: step_clarity
    question: >
      Read each workflow step in this skill. For each step, check:
      (1) does the step state exactly one action? (2) does the step
      have an unambiguous completion criterion (exit code, file
      created, output to read)? Rate the overall step clarity.
    evidence_source: skill.md step excerpts
    metric: score
    criteria:
      - "all steps are unclear or compound"
      - "few steps are clear"
      - "most steps are clear with completion criteria"
      - "every step states one action with an unambiguous completion criterion"
    target: ">= 2"
    weight: 1.0
    polarity: positive
    mcacs: Cohesion

  - name: prose_executability
    question: >
      Read only the prose-only steps (marked [SCRIPTED: no]). Can
      a model with basic instruction-following ability execute them
      correctly without domain expertise, implicit context, or
      multi-hop reasoning? A prose step is executable if it tells
      the agent exactly what to do, what to look at, and what to
      output.
    evidence_source: skill.md prose-only step excerpts
    metric: score
    criteria:
      - "prose steps require deep expertise or are ambiguous"
      - "some prose steps need expertise or multi-hop reasoning"
      - "most prose steps are self-contained and executable"
      - "all prose steps are self-contained with explicit instructions"
    target: ">= 2"
    weight: 1.0
    polarity: positive
    mcacs: Separation of Concerns

  - name: model_portability
    question: >
      How many model-capability assumptions exist in SKILL.md? Count
      each instance of: multi-hop reasoning chains without script
      checkpoints, inline code block extraction the agent must perform,
      implicit scope reasoning, and instructions requiring frontier-
      class understanding to parse correctly.
    evidence_source: skill.md
    metric: count
    target: "<= 2"
    weight: 1.0
    mcacs: Coupling

  - name: interface_opacity
    question: >
      Does SKILL.md reference script internals such as variable names,
      intermediate temporary files, internal function names, or
      implementation details? Or does it only reference script inputs
      (arguments) and outputs (exit codes, stdout)?
    evidence_source: skill.md
    metric: boolean
    target: "true"
    weight: 1.0
    mcacs: Abstraction
