schema-version: "1.1"
schema-type: operable
description: >
  Operable standard for AgentFS skills. Evaluates both build-time
  structural readiness (BMBT anatomy) and runtime execution
  correctness (CECX from traces). Applied by skill-eval and
  agentfs-eval.

  Build-time BMBT (Bones, Muscle, Brain, Tool/Harness) assesses
  whether the skill has the structural prerequisites for reliable
  mid-range model operation. Runtime CECX assesses whether the
  agent actually executed correctly, scored from execution traces.

dimensions:
  # --- Build-time Readiness (BMBT) ---

  - name: has_bones
    question: >
      Does the skill have a scripts/ directory containing at least
      one executable shell script that performs a deterministic
      operation (data gathering, state checking, file manipulation)?
    evidence_source: filesystem
    metric: boolean
    target: "true"
    weight: 1.0
    phase: build

  - name: has_muscle
    question: >
      Does SKILL.md contain CNL prose that orchestrates script
      execution — specifying which scripts to run, in what order,
      and what decisions to make based on script output — rather
      than embedding deterministic logic inline?
    evidence_source: skill.md
    metric: boolean
    target: "true"
    weight: 1.0
    phase: build

  - name: has_brain
    question: >
      For skills requiring semantic judgment, are those judgments
      delegated to SDM via scripts rather than requiring inline
      multi-hop agent reasoning? Skills with no semantic judgment
      requirements pass this dimension by default.
    evidence_source: skill.md + scripts/
    metric: boolean
    target: "true"
    weight: 1.0
    phase: build
    applies_to: [has_semantic_judgments]

  - name: has_harness
    question: >
      Can the skill be executed and measured by an external harness
      (goose run, goose recipe, benchmark.sh)? Does a test exist
      or can one be constructed from the skill's registered signals?
    evidence_source: benchmark.sh test list + skill signals
    metric: boolean
    target: "true"
    weight: 1.0
    phase: build

  # --- Runtime Correctness (CECX) ---
  # Scored using CECX weighting:
  #   Correctness 0.40, Efficiency 0.25,
  #   Comprehension 0.25, Complexity 0.10

  # -- Correctness (weight 0.40) --

  - name: step_completion
    question: >
      Did the agent complete all steps recorded in the trace? Check
      that every expected step from trace_init to trace_end was
      executed and that the end record shows zero errors.
    evidence_source: trace JSONL
    metric: boolean
    target: "true"
    weight: 0.40
    phase: runtime

  - name: no_fabrication
    question: >
      Based on the trace, did the agent use only real data from script
      outputs? Look for steps where the detail field contains results
      that could not have come from the preceding script execution
      (fabricated counts, invented file paths, made-up status values).
    evidence_source: trace JSONL
    metric: boolean
    target: "true"
    weight: 0.40
    phase: runtime

  # -- Efficiency (weight 0.25) --

  - name: minimal_inference_hops
    question: >
      Did the agent reach deterministic script checkpoints with
      minimal reasoning steps? Count inference hops (steps where
      exit code is 0 but action is not a script call). Fewer hops
      means more efficient execution.
    evidence_source: trace JSONL
    metric: count
    target: "<= 2"
    weight: 0.25
    phase: runtime

  - name: token_efficiency
    question: >
      If token records exist in the trace, is the total token count
      reasonable for the task? Compare total_tokens in the end record
      against the step count. A well-scripted skill should use fewer
      than 1000 tokens per step on average.
    evidence_source: trace JSONL
    metric: ratio
    target: "<= 0.50"
    weight: 0.25
    phase: runtime

  # -- Comprehension (weight 0.25) --

  - name: correct_sequence
    question: >
      Did the agent execute steps in the correct order as defined by
      the step numbers in the trace? Check that step numbers are
      monotonically increasing and no steps were skipped or reordered.
    evidence_source: trace JSONL
    metric: boolean
    target: "true"
    weight: 0.25
    phase: runtime

  - name: scope_resolution
    question: >
      If the skill involves scope resolution (USER vs PROJECT), did
      the agent resolve scope correctly based on the trace evidence?
      Look for scope-related detail fields that match expected context.
    evidence_source: trace JSONL
    metric: boolean
    target: "true"
    weight: 0.25
    phase: runtime

  # -- Complexity (weight 0.10) --

  - name: no_improvised_recovery
    question: >
      Did the agent follow the defined error handling path when errors
      occurred, rather than improvising a recovery? Check for steps
      after an error (exit != 0) — did the subsequent steps follow
      the expected error handling pattern or did the agent invent
      ad-hoc workarounds?
    evidence_source: trace JSONL
    metric: boolean
    target: "true"
    weight: 0.10
    phase: runtime
