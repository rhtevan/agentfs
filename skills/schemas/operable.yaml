schema-version: "1.0"
schema-type: operable
description: >
  Structural compliance standard for Operable Skills. Evaluates whether
  a skill follows the four-layer architecture (bones, muscle, controller,
  harness) and is ready for mid-range model operation. Used by skill-check
  and skill-evolve.

dimensions:
  - name: has_scripts
    question: >
      Does the skill have a scripts/ directory containing at least one
      executable shell script that performs a deterministic operation?
    evidence_source: filesystem
    metric: boolean
    target: "true"
    weight: 1.0

  - name: has_observation_schema
    question: >
      Does the skill have an observation.yaml file that defines
      execution evaluation dimensions for post-execution SDM scoring?
    evidence_source: filesystem
    metric: boolean
    target: "true"
    weight: 1.0

  - name: cnl_compliance
    question: >
      Do the action steps in SKILL.md follow Controlled Natural Language
      rules? Check: each sentence states exactly one action, all steps
      use active imperative voice, and one term is used per concept
      throughout (no synonym mixing).
    evidence_source: skill.md
    metric: ratio
    target: ">= 0.95"
    weight: 1.0

  - name: sdm_integration
    question: >
      For skills that require semantic judgment (Pattern C: prose-only
      analysis, evaluation, or alignment checking), are those judgments
      delegated to SDM via scripts rather than requiring the agent to
      perform multi-hop qualitative reasoning inline?
    evidence_source: skill.md + scripts/
    metric: boolean
    target: "true"
    weight: 1.0
    applies_to: [pattern_c]

  - name: trace_instrumentation
    question: >
      Do the skill's scripts source trace-lib.sh and call trace_step()
      to produce an agent-agnostic execution trace? Check for the
      presence of trace_init, trace_step, and trace_end calls.
    evidence_source: scripts/
    metric: boolean
    target: "true"
    weight: 1.0

  - name: bones_muscle_separation
    question: >
      Is deterministic logic (data gathering, scope resolution, file
      operations, API calls) implemented in scripts (bones), while
      SKILL.md prose (muscle) contains only orchestration instructions
      (which scripts to run, in what order, what decisions to make
      based on script output)?
    evidence_source: skill.md + scripts/
    metric: boolean
    target: "true"
    weight: 1.0
